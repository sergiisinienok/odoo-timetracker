# Production on the VM that already runs nginx on 80/443 AND the staging stack —
# docs/deploy-production.md. Same shape as docker-compose.staging.yml, except the
# loopback port is 8081 because staging holds 8080.
#
# Used by adding to .env (ops/configure-prod-env.sh does this):
#   COMPOSE_PROJECT_NAME=tti-prod
#   COMPOSE_FILE=docker-compose.yml:docker-compose.production.yml
# COMPOSE_PROJECT_NAME is what keeps production's containers and volumes (database,
# backups, logs) separate from staging's; without it a second checkout would be
# named after its directory and, if that matched, would share staging's.
services:
  caddy:
    ports: !override
      - "127.0.0.1:8081:80"
    environment:
      CADDY_ADDRESS: ":80" # no certificate handling: nginx owns TLS
  db:
    ports: !reset []
