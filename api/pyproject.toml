[project]
name = "tti"
version = "0.1.0"
description = "Odoo Time Tracker API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17",
    "fastapi==0.139.*",
    "httpx==0.28.*",
    "psycopg[binary,pool]>=3,<4",
    "pydantic==2.13.*",
    "sqlalchemy>=2.0.50,<2.1",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "odoo: hits the live Odoo sandbox, not run by default",
]
addopts = "-m 'not odoo'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
