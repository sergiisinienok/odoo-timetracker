[project]
name = "tti"
version = "0.1.0"
description = "Odoo Time Tracker API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.17",
    "fastapi==0.139.*",
    "google-auth[requests]>=2",
    "greenlet>=3.5.6",
    "httpx==0.28.*",
    "psycopg[binary,pool]>=3,<4",
    "pydantic==2.13.*",
    "pyjwt>=2",
    "sqlalchemy>=2.0.50,<2.1",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "odoo: hits the live Odoo sandbox — run explicitly (pytest tests/odoo/...), not part of a plain `pytest` fast-unit-only run",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
]
