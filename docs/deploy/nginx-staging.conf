# nginx server block for staging — docs/deploy-staging.md, step 7.
# Install as /etc/nginx/sites-available/timetracker-staging and symlink it into
# sites-enabled. It is HTTP-only on purpose: `certbot --nginx -d <hostname>` adds
# the port-443 block, the certificate paths and the HTTP->HTTPS redirect itself.
#
# It proxies to the stack's Caddy on 127.0.0.1:8080 (docker-compose.staging.yml).
# Security headers, the CSP and the /api path handling all live in the Caddyfile,
# so none are repeated here (repeating HSTS or the CSP would send them twice).
server {
    listen 80;
    listen [::]:80;
    server_name staging.timetracker.particlesglobal.com;

    # Every legitimate request body is a few hundred bytes of JSON; Caddy and the
    # api both enforce 64 KB as well.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # OVERWRITE with the real peer, never $proxy_add_x_forwarded_for: appending
        # would keep a client-supplied X-Forwarded-For, and the api rate-limits on
        # the first address in that header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
